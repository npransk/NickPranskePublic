[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yahtzee-mcmilp"
version = "0.1.0"
description = "Yahtzee bot: exact turn expectimax + Monte Carlo scenarios + MILP (HiGHS) future-value estimates."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yahtzee-mcmilp = "yahtzee_mcmilp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
